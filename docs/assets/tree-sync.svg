<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="585" viewBox="0 0 1100 585" role="img" aria-labelledby="title desc">
<title id="title">Two message trees synchronize</title>
<desc id="desc">A repeating 16-second diagram. Peers compare different snapshot roots, skip an identical subtree, inspect a differing subtree, exchange missing blobs C and D, validate them, and obtain matching new roots. The example assumes no concurrent arrivals or expiry.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#8092ae" stroke-width="1.5"/></marker>
  <style>
    text {font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#e7eefb}
    .muted {fill:#96a8c5} .small {font-size:13px} .label {font-size:15px; font-weight:600}
    .edge {fill:none;stroke:#3c506d;stroke-width:2}
    .node {fill:#17263c;stroke:#536b8e;stroke-width:1.5}
    .shared {fill:#102f30;stroke:#53c9ad;stroke-width:1.5}
    .different {fill:#332a20;stroke:#f4bd69;stroke-width:1.5}
    .ghost {fill:none;stroke:#52627c;stroke-dasharray:4 5}
    .step {opacity:0;animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:steps(1,end)}
    .s1 {animation-name:step1}.s2 {animation-name:step2}.s3 {animation-name:step3}.s4 {animation-name:step4}.s5 {animation-name:step5}
    @keyframes step1 {0%,14%{opacity:1}15%,100%{opacity:0}}
    @keyframes step2 {0%{opacity:0}15%,31%{opacity:1}32%,100%{opacity:0}}
    @keyframes step3 {0%{opacity:0}32%,47%{opacity:1}48%,100%{opacity:0}}
    @keyframes step4 {0%{opacity:0}48%,73%{opacity:1}74%,100%{opacity:0}}
    @keyframes step5 {0%{opacity:0}74%,99%{opacity:1}100%{opacity:0}}
    .before {animation:before 16s steps(1,end) infinite}
    .after {opacity:0;animation:after 16s steps(1,end) infinite}
    @keyframes before {0%,73%{opacity:1}74%,99%{opacity:0}100%{opacity:1}}
    @keyframes after {0%,73%{opacity:0}74%,99%{opacity:1}100%{opacity:0}}
    .ring {fill:none;stroke:#f4bd69;stroke-width:3}
    .packet {opacity:0}
    @media (prefers-reduced-motion: reduce) {
      .step,.before,.after {animation:none}
      .before {opacity:1}.after,.step,.packet {display:none}.s1 {display:inline;opacity:1}
    }
  </style>
</defs>
<rect width="1100" height="585" rx="20" fill="#0b1423"/>
<text x="40" y="48" font-size="26" font-weight="700">One tree. Two partial replicas.</text>
<text x="40" y="76" class="muted" font-size="14">Compare snapshot hashes · transfer only missing blobs · repeat with fresh roots</text>
<rect x="32" y="104" width="498" height="359" rx="16" fill="#101d30"/>
<rect x="570" y="104" width="498" height="359" rx="16" fill="#101d30"/>
<text x="56" y="137" class="label">PEER A</text><text x="594" y="137" class="label">PEER B</text>

<path class="edge" d="M280 207L158 280M280 207L400 280M158 310L108 377M158 310L208 377M400 310L350 377M400 310L450 377"/>
<rect class="node" x="220" y="165" width="120" height="44" rx="10"/>
<g class="before"><text x="280" y="192" text-anchor="middle" class="label">root A</text></g><g class="after"><text x="280" y="192" text-anchor="middle" class="label">root AB</text></g>
<rect class="shared" x="108" y="270" width="100" height="42" rx="10"/>
<text x="158" y="296" text-anchor="middle" class="label">same hash</text>
<rect class="different" x="350" y="270" width="100" height="42" rx="10"/>
<g class="before"><text x="400" y="296" text-anchor="middle" class="label">hash A</text></g><g class="after"><text x="400" y="296" text-anchor="middle" class="label">hash CD</text></g>
<text x="158" y="253" text-anchor="middle" class="small muted">prefix 0</text><text x="400" y="253" text-anchor="middle" class="small muted">prefix 1</text>
<rect x="83" y="371" width="50" height="42" rx="9" class="shared"/><text x="108" y="398" text-anchor="middle" class="label">A</text>
<rect x="183" y="371" width="50" height="42" rx="9" class="shared"/><text x="208" y="398" text-anchor="middle" class="label">B</text>
<rect x="325" y="371" width="50" height="42" rx="9" class="node"/><text x="350" y="398" text-anchor="middle" class="label">C</text>
<g class="before"><rect x="425" y="371" width="50" height="42" rx="9" class="ghost"/><text x="450" y="398" text-anchor="middle" class="muted label">?</text></g>
<g class="after"><rect x="425" y="371" width="50" height="42" rx="9" class="shared"/><text x="450" y="398" text-anchor="middle" class="label">D</text></g>
<g class="step s2"><rect x="100" y="262" width="116" height="58" rx="14" fill="none" stroke="#53c9ad" stroke-width="3"/><text x="158" y="442" text-anchor="middle" class="small">Equal subtree → skip</text></g>
<g class="step s3"><rect x="342" y="262" width="116" height="58" rx="14" class="ring"/><text x="400" y="442" text-anchor="middle" class="small">Inspect missing leaves</text></g>
<g class="after"><rect x="216" y="161" width="128" height="52" rx="13" fill="none" stroke="#53c9ad" stroke-width="2"/><text x="280" y="442" text-anchor="middle" class="small">A · B · C · D</text></g>
<path class="edge" d="M818 207L696 280M818 207L938 280M696 310L646 377M696 310L746 377M938 310L888 377M938 310L988 377"/>
<rect class="node" x="758" y="165" width="120" height="44" rx="10"/>
<g class="before"><text x="818" y="192" text-anchor="middle" class="label">root B</text></g><g class="after"><text x="818" y="192" text-anchor="middle" class="label">root AB</text></g>
<rect class="shared" x="646" y="270" width="100" height="42" rx="10"/>
<text x="696" y="296" text-anchor="middle" class="label">same hash</text>
<rect class="different" x="888" y="270" width="100" height="42" rx="10"/>
<g class="before"><text x="938" y="296" text-anchor="middle" class="label">hash B</text></g><g class="after"><text x="938" y="296" text-anchor="middle" class="label">hash CD</text></g>
<text x="696" y="253" text-anchor="middle" class="small muted">prefix 0</text><text x="938" y="253" text-anchor="middle" class="small muted">prefix 1</text>
<rect x="621" y="371" width="50" height="42" rx="9" class="shared"/><text x="646" y="398" text-anchor="middle" class="label">A</text>
<rect x="721" y="371" width="50" height="42" rx="9" class="shared"/><text x="746" y="398" text-anchor="middle" class="label">B</text>
<g class="before"><rect x="863" y="371" width="50" height="42" rx="9" class="ghost"/><text x="888" y="398" text-anchor="middle" class="muted label">?</text></g>
<g class="after"><rect x="863" y="371" width="50" height="42" rx="9" class="shared"/><text x="888" y="398" text-anchor="middle" class="label">C</text></g>
<rect x="963" y="371" width="50" height="42" rx="9" class="node"/><text x="988" y="398" text-anchor="middle" class="label">D</text>
<g class="step s2"><rect x="638" y="262" width="116" height="58" rx="14" fill="none" stroke="#53c9ad" stroke-width="3"/><text x="696" y="442" text-anchor="middle" class="small">Equal subtree → skip</text></g>
<g class="step s3"><rect x="880" y="262" width="116" height="58" rx="14" class="ring"/><text x="938" y="442" text-anchor="middle" class="small">Inspect missing leaves</text></g>
<g class="after"><rect x="754" y="161" width="128" height="52" rx="13" fill="none" stroke="#53c9ad" stroke-width="2"/><text x="818" y="442" text-anchor="middle" class="small">A · B · C · D</text></g>
<g class="step s1"><path d="M347 187H750" fill="none" stroke="#8092ae" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="484" y="171" width="132" height="30" rx="15" fill="#332a20"/><text x="550" y="192" text-anchor="middle" class="label" fill="#f4bd69">roots differ</text></g>
<g class="step s4"><path d="M350 391C480 460 730 460 888 391M988 391C855 345 590 345 450 391" fill="none" stroke="#8092ae" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/></g>

<g class="packet"><rect x="-17" y="-17" width="34" height="34" rx="8" fill="#f4bd69"/><text y="5" text-anchor="middle" style="fill:#152033;font-size:16px;font-weight:700">C</text>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.49;0.72;0.74;1" dur="16s" repeatCount="indefinite"/>
<animateMotion path="M350 391C480 460 730 460 888 391" keyPoints="0;0;1;1" keyTimes="0;0.49;0.72;1" calcMode="linear" dur="16s" repeatCount="indefinite"/>
</g>
<g class="packet"><rect x="-17" y="-17" width="34" height="34" rx="8" fill="#f4bd69"/><text y="5" text-anchor="middle" style="fill:#152033;font-size:16px;font-weight:700">D</text>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.49;0.72;0.74;1" dur="16s" repeatCount="indefinite"/>
<animateMotion path="M988 391C855 345 590 345 450 391" keyPoints="0;0;1;1" keyTimes="0;0.49;0.72;1" calcMode="linear" dur="16s" repeatCount="indefinite"/>
</g>
<g class="step s1"><text x="48" y="515" font-size="23" font-weight="700">01  Compare roots</text><text x="48" y="548" font-size="16" class="muted">Each peer reads a fixed snapshot of the other tree.</text></g>
<g class="step s2"><text x="48" y="515" font-size="23" font-weight="700">02  Skip equal branches</text><text x="48" y="548" font-size="16" class="muted">The subtree containing A and B already matches.</text></g>
<g class="step s3"><text x="48" y="515" font-size="23" font-weight="700">03  Walk differing branches</text><text x="48" y="548" font-size="16" class="muted">Peer A lacks D. Peer B lacks C.</text></g>
<g class="step s4"><text x="48" y="515" font-size="23" font-weight="700">04  Exchange and validate</text><text x="48" y="548" font-size="16" class="muted">A sends C → B. B sends D → A. Verify IDs, expiry and PoW.</text></g>
<g class="step s5"><text x="48" y="515" font-size="23" font-weight="700">05  Compare fresh roots</text><text x="48" y="548" font-size="16" class="muted">Both peers now hold A, B, C and D. Their new roots match.</text></g>
</svg>
