name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Configure Android NDK for Rust
        run: |
          ndk_root="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$ndk_root" ] || [ ! -d "$ndk_root" ]; then
            ndk_root="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -n "$ndk_root"
          ndk_bin="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -d "$ndk_bin"
          android_api=21
          test -x "$ndk_bin/aarch64-linux-android${android_api}-clang"
          test -x "$ndk_bin/armv7a-linux-androideabi${android_api}-clang"
          test -x "$ndk_bin/x86_64-linux-android${android_api}-clang"
          echo "ANDROID_NDK_HOME=$ndk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_root" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk_bin/aarch64-linux-android${android_api}-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$ndk_bin/armv7a-linux-androideabi${android_api}-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$ndk_bin/x86_64-linux-android${android_api}-clang" >> "$GITHUB_ENV"
          echo "$ndk_bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APKs
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build apk --release --split-per-abi --build-name "$version" --build-number "${{ github.run_number }}"
      - name: Package artifacts
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../dist/ddm-android-arm64-v8a-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "../dist/ddm-android-armeabi-v7a-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "../dist/ddm-android-x86_64-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ddm-android
          path: dist/ddm-android-*-${{ github.ref_name }}.apk
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl flatpak flatpak-builder imagemagick libgtk-3-dev ninja-build pkg-config
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux release
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build linux --release --build-name "$version" --build-number "${{ github.run_number }}"
      - name: Package artifact
        run: |
          test -x build/linux/x64/release/bundle/DDM
          mkdir -p ../dist
          tar -C build/linux/x64/release/bundle -czf "../dist/ddm-linux-x64-${GITHUB_REF_NAME}.tar.gz" .
      - name: Prepare Linux packaging assets
        run: |
          mkdir -p build/linux/packaging
          if command -v magick >/dev/null 2>&1; then
            magick linux/runner/resources/app_icon.png -resize 512x512 build/linux/packaging/app.waus.ddm.png
          else
            convert linux/runner/resources/app_icon.png -resize 512x512 build/linux/packaging/app.waus.ddm.png
          fi
      - name: Package AppImage
        run: |
          mkdir -p ../dist AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp -a build/linux/x64/release/bundle/. AppDir/usr/bin/
          cp linux/packaging/app.waus.ddm.desktop AppDir/usr/share/applications/app.waus.ddm.desktop
          cp linux/packaging/app.waus.ddm.desktop AppDir/app.waus.ddm.desktop
          cp build/linux/packaging/app.waus.ddm.png AppDir/usr/share/icons/hicolor/512x512/apps/app.waus.ddm.png
          cp build/linux/packaging/app.waus.ddm.png AppDir/app.waus.ddm.png
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/DDM" "$@"' \
            > AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/DDM
          curl -L -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "../dist/ddm-linux-x64-${GITHUB_REF_NAME}.AppImage"
      - name: Package Flatpak bundle
        run: |
          mkdir -p ../dist flatpak-repo
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          cp linux/packaging/app.waus.ddm.flatpak.yml app.waus.ddm.flatpak.yml
          flatpak-builder --force-clean --repo=flatpak-repo flatpak-build app.waus.ddm.flatpak.yml
          flatpak build-bundle flatpak-repo "../dist/ddm-linux-x64-${GITHUB_REF_NAME}.flatpak" app.waus.ddm
      - uses: actions/upload-artifact@v4
        with:
          name: ddm-linux-x64
          path: |
            dist/ddm-linux-x64-${{ github.ref_name }}.tar.gz
            dist/ddm-linux-x64-${{ github.ref_name }}.AppImage
            dist/ddm-linux-x64-${{ github.ref_name }}.flatpak
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS release
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build macos --release --build-name "$version" --build-number "${{ github.run_number }}"
      - name: Package artifact
        run: |
          test -d build/macos/Build/Products/Release/DDM.app
          mkdir -p ../dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/DDM.app "../dist/ddm-macos-arm64-${GITHUB_REF_NAME}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ddm-macos-arm64
          path: dist/ddm-macos-arm64-${{ github.ref_name }}.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $buildLog = '..\build\windows-build.log'
          New-Item -ItemType Directory -Force (Split-Path $buildLog)
          flutter build windows --release --build-name $version --build-number "${{ github.run_number }}" --verbose *> $buildLog
          $exitCode = $LASTEXITCODE
          Get-Content $buildLog -Tail 300
          if ($exitCode -ne 0) {
            exit $exitCode
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-build-log
          path: build/windows-build.log
          if-no-files-found: ignore
      - name: Package artifact
        run: |
          Test-Path build\windows\x64\runner\Release\DDM.exe
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) {
            throw 'Visual Studio with MSVC tools was not found.'
          }
          $crtDir = Get-ChildItem -Path (Join-Path $vsRoot 'VC\Redist\MSVC') -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\Microsoft.VC143.CRT' } |
            Where-Object { Test-Path (Join-Path $_ 'vcruntime140.dll') } |
            Select-Object -First 1
          if (-not $crtDir) {
            throw 'MSVC x64 runtime redistributable directory was not found.'
          }
          Copy-Item (Join-Path $crtDir '*.dll') build\windows\x64\runner\Release\ -Force
          New-Item -ItemType Directory -Force ..\dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "..\dist\ddm-windows-x64-$env:GITHUB_REF_NAME.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ddm-windows-x64
          path: dist/ddm-windows-x64-${{ github.ref_name }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android
      - linux
      - macos
      - windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: DDM ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
