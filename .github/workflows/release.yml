name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APKs
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build apk --release --split-per-abi --build-name "$version" --build-number "${{ github.run_number }}"
      - name: Package artifacts
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../dist/ddm-android-arm64-v8a-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "../dist/ddm-android-armeabi-v7a-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "../dist/ddm-android-x86_64-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ddm-android
          path: dist/ddm-android-*-${{ github.ref_name }}.apk
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl flatpak flatpak-builder imagemagick libgtk-3-dev ninja-build pkg-config
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux release
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build linux --release --build-name "$version" --build-number "${{ github.run_number }}"
      - name: Package artifact
        run: |
          test -x build/linux/x64/release/bundle/DDM
          mkdir -p ../dist
          tar -C build/linux/x64/release/bundle -czf "../dist/ddm-linux-x64-${GITHUB_REF_NAME}.tar.gz" .
      - name: Prepare Linux packaging assets
        run: |
          mkdir -p build/linux/packaging
          if command -v magick >/dev/null 2>&1; then
            magick linux/runner/resources/app_icon.png -resize 512x512 build/linux/packaging/app.waus.ddm.png
          else
            convert linux/runner/resources/app_icon.png -resize 512x512 build/linux/packaging/app.waus.ddm.png
          fi
      - name: Package AppImage
        run: |
          mkdir -p ../dist AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp -a build/linux/x64/release/bundle/. AppDir/usr/bin/
          cp linux/packaging/app.waus.ddm.desktop AppDir/usr/share/applications/app.waus.ddm.desktop
          cp linux/packaging/app.waus.ddm.desktop AppDir/app.waus.ddm.desktop
          cp build/linux/packaging/app.waus.ddm.png AppDir/usr/share/icons/hicolor/512x512/apps/app.waus.ddm.png
          cp build/linux/packaging/app.waus.ddm.png AppDir/app.waus.ddm.png
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/DDM" "$@"' \
            > AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/DDM
          curl -L -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "../dist/ddm-linux-x64-${GITHUB_REF_NAME}.AppImage"
      - name: Package Flatpak bundle
        run: |
          mkdir -p ../dist flatpak-repo
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          cp linux/packaging/app.waus.ddm.flatpak.yml app.waus.ddm.flatpak.yml
          flatpak-builder --force-clean --repo=flatpak-repo flatpak-build app.waus.ddm.flatpak.yml
          flatpak build-bundle flatpak-repo "../dist/ddm-linux-x64-${GITHUB_REF_NAME}.flatpak" app.waus.ddm
      - uses: actions/upload-artifact@v4
        with:
          name: ddm-linux-x64
          path: |
            dist/ddm-linux-x64-${{ github.ref_name }}.tar.gz
            dist/ddm-linux-x64-${{ github.ref_name }}.AppImage
            dist/ddm-linux-x64-${{ github.ref_name }}.flatpak
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS release
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build macos --release --build-name "$version" --build-number "${{ github.run_number }}"
      - name: Package artifact
        run: |
          test -d build/macos/Build/Products/Release/DDM.app
          mkdir -p ../dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/DDM.app "../dist/ddm-macos-arm64-${GITHUB_REF_NAME}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ddm-macos-arm64
          path: dist/ddm-macos-arm64-${{ github.ref_name }}.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Windows build dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          choco install openssl -y --no-progress

          $opensslCommand = Get-Command openssl.exe -ErrorAction SilentlyContinue
          $candidateRoots = @()
          if ($opensslCommand) {
            $candidateRoots += Split-Path -Parent (Split-Path -Parent $opensslCommand.Source)
          }
          $candidateRoots += @(
            "$env:ProgramFiles\OpenSSL-Win64",
            "$env:ProgramFiles\OpenSSL",
            "${env:ProgramFiles(x86)}\OpenSSL-Win64",
            "${env:ProgramFiles(x86)}\OpenSSL",
            'C:\OpenSSL-Win64',
            'C:\OpenSSL',
            'C:\tools\OpenSSL-Win64',
            'C:\tools\OpenSSL'
          )

          $opensslRoot = $candidateRoots |
            Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\bn.h')) } |
            Select-Object -First 1
          if (-not $opensslRoot) {
            throw "OpenSSL headers were not found. Checked: $($candidateRoots -join ', ')"
          }

          $includeDir = Join-Path $opensslRoot 'include'
          $cryptoLib = Get-ChildItem -Path (Join-Path $opensslRoot 'lib') -Filter libcrypto.lib -Recurse | Select-Object -First 1
          $cryptoDll = Get-ChildItem -Path (Join-Path $opensslRoot 'bin') -Filter 'libcrypto*.dll' | Select-Object -First 1
          if (-not $cryptoLib) {
            throw 'OpenSSL libcrypto import library was not installed.'
          }
          if (-not $cryptoDll) {
            throw 'OpenSSL libcrypto runtime DLL was not installed.'
          }

          $pkgConfigDir = Resolve-Path (New-Item -ItemType Directory -Force ..\build\pkgconfig)
          $compatOpenSslRoot = Resolve-Path (New-Item -ItemType Directory -Force ..\build\openssl-root)
          $compatIncludeDir = Resolve-Path (New-Item -ItemType Directory -Force (Join-Path $compatOpenSslRoot.Path 'include'))
          $compatOpenSslIncludeDir = Resolve-Path (New-Item -ItemType Directory -Force (Join-Path $compatIncludeDir.Path 'openssl'))
          $compatLibDir = Resolve-Path (New-Item -ItemType Directory -Force (Join-Path $compatOpenSslRoot.Path 'lib'))
          Copy-Item (Join-Path $includeDir 'openssl\*') $compatOpenSslIncludeDir.Path -Recurse -Force
          Copy-Item $cryptoLib.FullName (Join-Path $compatLibDir.Path 'libcrypto.lib') -Force
          Copy-Item $cryptoLib.FullName (Join-Path $compatLibDir.Path 'crypto.lib') -Force
          if (-not (Test-Path (Join-Path $compatOpenSslRoot.Path 'include\openssl\bn.h'))) {
            throw 'Staged OpenSSL headers are incomplete.'
          }
          if (-not (Test-Path (Join-Path $compatOpenSslRoot.Path 'lib\libcrypto.lib'))) {
            throw 'Staged OpenSSL import library is missing.'
          }

          $pcIncludeDir = ($compatIncludeDir.Path -replace '\\', '/')
          $pcLibDir = ($compatLibDir.Path -replace '\\', '/')
          @(
            'Name: OpenSSL',
            'Description: OpenSSL crypto library',
            'Version: 3',
            "Libs: -L`"$pcLibDir`" -lcrypto",
            "Cflags: /I`"$pcIncludeDir`""
          ) | Set-Content -Encoding ASCII (Join-Path $pkgConfigDir.Path 'openssl.pc')

          $ciBinDir = Resolve-Path (New-Item -ItemType Directory -Force ..\build\ci-bin)
          @(
            '@echo off',
            "echo /I`"$pcIncludeDir`" -L`"$pcLibDir`" -lcrypto"
          ) | Set-Content -Encoding ASCII (Join-Path $ciBinDir.Path 'pkg-config.bat')
          @(
            '@echo off',
            "echo /I`"$pcIncludeDir`" -L`"$pcLibDir`" -lcrypto"
          ) | Set-Content -Encoding ASCII (Join-Path $ciBinDir.Path 'pkg-config.cmd')

          $env:PKG_CONFIG_PATH = $pkgConfigDir.Path
          $env:Path = "$($ciBinDir.Path);$env:Path"
          Get-Command pkg-config
          pkg-config --cflags --libs openssl

          "OPENSSL_ROOT=$($compatOpenSslRoot.Path)" >> $env:GITHUB_ENV
          "OPENSSL_BIN=$($cryptoDll.DirectoryName)" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$($pkgConfigDir.Path)" >> $env:GITHUB_ENV
          $cryptoDll.DirectoryName >> $env:GITHUB_PATH
          $ciBinDir.Path >> $env:GITHUB_PATH
      - name: Install dependencies
        run: flutter pub get
      - name: Verify VDF dependency
        run: |
          $vdfLock = Get-Content pubspec.lock -Raw
          if ($vdfLock -notmatch 'ref: "v0\.3\.4"') {
            throw 'vdfrsa dependency did not resolve to v0.3.4.'
          }
          if ($vdfLock -notmatch 'resolved-ref: e7af30f7df0319c4b39f4c6666d68a043225c0a6') {
            throw 'vdfrsa dependency did not resolve to the expected commit.'
          }
          $vdfLockEntry = Select-String -Path pubspec.lock -Pattern 'vdfrsa' -Context 0,8
          if (-not $vdfLockEntry) {
            throw 'vdfrsa dependency was not found in pubspec.lock.'
          }
          $vdfLockEntry
      - name: Build Windows release
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Test-Path "$env:OPENSSL_ROOT\include\openssl\bn.h"
          Test-Path "$env:OPENSSL_ROOT\lib\libcrypto.lib"
          Get-Command pkg-config
          pkg-config --cflags --libs openssl
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $buildLog = '..\build\windows-build.log'
          flutter build windows --release --build-name $version --build-number "${{ github.run_number }}" --verbose *> $buildLog
          $exitCode = $LASTEXITCODE
          Get-Content $buildLog -Tail 300
          if ($exitCode -ne 0) {
            exit $exitCode
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-build-log
          path: build/windows-build.log
          if-no-files-found: ignore
      - name: Package artifact
        run: |
          Test-Path build\windows\x64\runner\Release\DDM.exe
          Copy-Item "$env:OPENSSL_BIN\libcrypto*.dll" build\windows\x64\runner\Release\
          New-Item -ItemType Directory -Force ..\dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "..\dist\ddm-windows-x64-$env:GITHUB_REF_NAME.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ddm-windows-x64
          path: dist/ddm-windows-x64-${{ github.ref_name }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android
      - linux
      - macos
      - windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: DDM ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
